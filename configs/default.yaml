# @package _global_

# enable color logging
defaults:
  - override /hydra/hydra_logging: colorlog
  - override /hydra/job_logging: colorlog
  - _self_

# Shared runtime defaults. experiment/*.yaml overrides task-specific settings.
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 100 # prevents early stopping
  max_epochs: 200
  accelerator: gpu
  devices: 1
  log_every_n_steps: 50
  enable_model_summary: true # enable model summary
  check_val_every_n_epoch: 1 # perform a validation loop every N training epochs
  deterministic: false # set true to to ensure deterministic results

  # precision: 16 # mixed precision for extra speed-up

  # Alternative trainer settings (replace the active values above).
  # Replace the corresponding settings above when selecting an alternative.
  # For DDP, also add strategy, num_nodes, and sync_batchnorm below.

  # CPU (cpu.yaml)
  # accelerator: cpu
  # devices: 1

  # GPU (gpu.yaml)
  # accelerator: gpu
  # devices: 1

  # Apple Silicon (mps.yaml)
  # accelerator: mps
  # devices: 1

  # Multi-GPU DDP (ddp.yaml)
  # strategy: ddp
  # accelerator: gpu
  # devices: 4
  # num_nodes: 1
  # sync_batchnorm: True

  # Simulated DDP (ddp_sim.yaml)
  # simulate DDP on CPU, useful for debugging
  # accelerator: cpu
  # devices: 2
  # strategy: ddp_spawn

callbacks:
  # https://lightning.ai/docs/pytorch/stable/api/lightning.pytorch.callbacks.ModelCheckpoint.html
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints # directory to save the model file
    filename: "epoch_{epoch:03d}" # checkpoint filename
    monitor: "val/acc" # name of the logged metric which determines when model is improving
    verbose: False # verbosity mode
    save_last: True # additionally always save an exact copy of the last checkpoint to a file last.ckpt
    save_top_k: 1 # save k best models (determined by above metric)
    mode: "max" # "max" means higher metric value is better, can be also "min"
    auto_insert_metric_name: False # when True, the checkpoints filenames will contain the metric name
    save_weights_only: False # if True, then only the model’s weights will be saved
    every_n_train_steps: null # number of training steps between checkpoints
    train_time_interval: null # checkpoints are monitored at the specified time interval
    every_n_epochs: null # number of epochs between checkpoints
    save_on_train_epoch_end: null # whether to run checkpointing at the end of the training epoch or the end of validation

  # https://lightning.ai/docs/pytorch/stable/api/lightning.pytorch.callbacks.EarlyStopping.html
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val/acc" # quantity to be monitored, must be specified !!!
    min_delta: 0. # minimum change in the monitored quantity to qualify as an improvement
    patience: 100 # number of checks with no improvement after which training will be stopped
    verbose: False # verbosity mode
    mode: "max" # "max" means higher metric value is better, can be also "min"
    strict: True # whether to crash the training if monitor is not found in the validation metrics
    check_finite: True # when set True, stops training when the monitor becomes NaN or infinite
    stopping_threshold: null # stop training immediately once the monitored quantity reaches this threshold
    divergence_threshold: null # stop training as soon as the monitored quantity becomes worse than this threshold
    check_on_train_epoch_end: null # whether to run early stopping at the end of the training epoch
    # log_rank_zero_only: False  # this keyword argument isn't available in stable version

  # https://lightning.ai/docs/pytorch/stable/api/lightning.pytorch.callbacks.RichModelSummary.html
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 1 # the maximum depth of layer nesting that the summary will include

  # # https://lightning.ai/docs/pytorch/latest/api/lightning.pytorch.callbacks.RichProgressBar.html
  # rich_progress_bar:
  #   _target_: lightning.pytorch.callbacks.RichProgressBar

  progress_bar:
    _target_: src.utils.progress.RankedProgressBar
    refresh_rate: ${oc.select:trainer.log_every_n_steps,50}
    rank_zero_only: true

logger:
  # Uncomment optional logger blocks to enable them alongside TensorBoard.
  # To train with many loggers at once, enable csv, tensorboard, and wandb.

  # https://www.tensorflow.org/tensorboard/
  tensorboard:
    _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
    save_dir: ${paths.output_dir}/tensorboard/
    name: null
    log_graph: false
    default_hp_metric: true
    prefix: ""
    # version: ""
  
  # csv logger built in lightning
  # csv:
  #   _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
